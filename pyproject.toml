[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-reading-frame"
dynamic = ["version"]
description = "Find open reading frames in DNA and get a report you can read."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Prabir Saha" }]
keywords = ["bioinformatics", "orf", "open reading frame", "dna", "translation", "fasta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/prabirsh/Open-Reading-Frame"
Issues = "https://github.com/prabirsh/Open-Reading-Frame/issues"

[project.scripts]
orf = "orf.cli:main"

[tool.setuptools]
packages = ["orf"]

[tool.setuptools.dynamic]
version = { attr = "orf.__version__" }

[tool.setuptools.package-data]
orf = ["data/*.fasta"]
